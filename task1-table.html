<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Task 1 - Table</title>
<style>
body {
    background: #eee;
    font-family: Arial;
}

table {
    border-collapse: collapse;
    margin: 50px auto;
    width: 600px;
}

th, td {
    padding: 15px;
    text-align: center;
}

th {
    background: #6fa3bd;
    color: white;
}

td:first-child, th:first-child {
    text-align: left;
    padding-left: 20px;
}

tr:nth-child(even) {
    background: #d9e3ea;
}

tr:nth-child(odd) {
    background: #c4d6e2;
}
</style>
</head>
<body>

<table>
    <tr>
        <th>Company</th>
        <th>Q1</th>
        <th>Q2</th>
        <th>Q3</th>
        <th>Q4</th>
    </tr>
    <tr>
        <td>Microsoft</td>
        <td>20.3</td>
        <td>30.5</td>
        <td>23.5</td>
        <td>40.3</td>
    </tr>
    <tr>
        <td>Google</td>
        <td>50.2</td>
        <td>40.63</td>
        <td>45.23</td>
        <td>39.3</td>
    </tr>
    <tr>
        <td>Apple</td>
        <td>25.4</td>
        <td>30.2</td>
        <td>33.3</td>
        <td>36.7</td>
    </tr>
    <tr>
        <td>IBM</td>
        <td>20.4</td>
        <td>15.6</td>
        <td>22.3</td>
        <td>29.3</td>
    </tr>
</table>

</body>
</html>
