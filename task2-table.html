<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Students Mark Sheet</title>
<style>
body {
    font-family: Arial;
    background: #eee;
}

table {
    border-collapse: collapse;
    margin: 50px auto;
    width: 700px;
}

th, td {
    border: 1px solid #3a7d1c;
    padding: 10px;
    text-align: center;
}

th[colspan] {
    background: #5fbf2f;
    color: white;
    font-size: 18px;
}

tr:nth-child(even) td {
    background: #cfe8b4;
}

tr:nth-child(odd) td {
    background: #b7d89a;
}

td:first-child, th:first-child {
    text-align: left;
}
</style>
</head>
<body>

<table>
    <tr>
        <th colspan="6">STUDENTS MARK SHEET</th>
    </tr>
    <tr>
        <th>Name</th>
        <th>Maths</th>
        <th>Science</th>
        <th>English</th>
        <th>Physics</th>
        <th>General Knowledge</th>
    </tr>
    <tr>
        <td>David</td>
        <td>85</td>
        <td>87</td>
        <td>88</td>
        <td>92</td>
        <td>88</td>
    </tr>
    <tr>
        <td>Richard</td>
        <td>91</td>
        <td>81</td>
        <td>78</td>
        <td>71</td>
        <td>74</td>
    </tr>
    <tr>
        <td>John</td>
        <td>81</td>
        <td>86</td>
        <td>88</td>
        <td>84</td>
        <td>92</td>
    </tr>
    <tr>
        <td>Tony</td>
        <td>84</td>
        <td>86</td>
        <td>87</td>
        <td>82</td>
        <td>81</td>
    </tr>
    <tr>
        <td>Scott</td>
        <td>71</td>
        <td>79</td>
        <td>82</td>
        <td>88</td>
        <td>89</td>
    </tr>
</table>

</body>
</html>
